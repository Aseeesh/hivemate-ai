name: ci-cd
on:
  push: { branches: [main] }
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # GitHub OIDC -> AWS, no long-lived keys

env:
  AWS_REGION: ap-southeast-2
  CDK_DEFAULT_REGION: ap-southeast-2

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: infra/package-lock.json }
      - uses: actions/setup-python@v5
        with: { python-version: '3.13' }
      - run: pip install pytest boto3 && pytest services/tests -q
      - run: npm ci
        working-directory: infra
      - run: npx tsc --noEmit && npx cdk synth --quiet -c alertEmail=ci@example.com -c senderEmail=ci@example.com
        working-directory: infra
      - run: npm ci && npm run typecheck && npm run build
        working-directory: web

  deploy:
    needs: test
    # Skipped until an AWS OIDC role is configured (AWS_ROLE_ARN repo variable).
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.AWS_ROLE_ARN != ''
    runs-on: ubuntu-latest
    environment: dev
    concurrency: deploy-dev
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: infra/package-lock.json }
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - run: npm ci
        working-directory: infra
      - name: Bootstrap (idempotent)
        run: npx cdk bootstrap
        working-directory: infra
        env:
          CDK_DEFAULT_ACCOUNT: ${{ vars.AWS_ACCOUNT_ID }}
      - name: Deploy
        run: npx cdk deploy --all --require-approval never -c alertEmail=${{ vars.ALERT_EMAIL }} -c senderEmail=${{ vars.SENDER_EMAIL }} --outputs-file outputs.json
        working-directory: infra
        env:
          CDK_DEFAULT_ACCOUNT: ${{ vars.AWS_ACCOUNT_ID }}
      - run: cat infra/outputs.json
